<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DumGenAi chat</title>

<style>
body {
    background: #1b1b1b;
    color: white;
    font-family: Arial, sans-serif;
    margin: 20px;
}

#chat {
    width: 100%;
    max-width: 80%;
    height: 400px;
    border: 2px solid #555;
    overflow-y: auto;
    padding: 10px;
    margin-bottom: 10px;
    background: #2d2d2d;
    border-radius: 8px;
}

.user {
    color: #66ccff;
}

.ai {
    color: #66ff66;
}

.input-group {
    display: flex;
    gap: 5px;
    width: 90%;
    max-width: 600px;
    margin-bottom: 10px;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #333;
    color: white;
}

button {
    padding: 10px 15px;
    background: #444;
    color: white;
    border: 1px solid #666;
    border-radius: 4px;
    cursor: pointer;
}

button:active {
    background: #666;
}

.control-buttons {
    display: flex;
    gap: 10px;
    width: 90%;
    max-width: 600px;
}

.btn-danger {
    background: #8b0000;
    border-color: #ff4d4d;
}

.btn-info {
    background: #005f73;
    border-color: #0a9396;
}

/* Modal Popup สำหรับแสดง Log */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: #2d2d2d;
    padding: 20px;
    border-radius: 8px;
    width: 85%;
    max-width: 500px;
    max-height: 70vh;
    overflow-y: auto;
    border: 1px solid #555;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #444;
    padding-bottom: 10px;
    margin-bottom: 10px;
}

.log-item {
    background: #1b1b1b;
    padding: 8px;
    margin-bottom: 6px;
    border-radius: 4px;
    word-break: break-all;
}
</style>

</head>
<body>

<h2>DumGenAi</h2>

<div id="chat"></div>

<div class="input-group">
    <input id="entry" placeholder="พิมพ์ข้อความ...">
    <button onclick="send()">ส่ง</button>
</div>

<div class="control-buttons">
    <button class="btn-info" onclick="showLog()">ดูความรู้ทั้งหมด (Log)</button>
    <button class="btn-danger" onclick="resetAI()">ล้างสมอง AI</button>
</div>

<!-- Modal หน้าต่างแสดง Log -->
<div id="logModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0;">รายการสิ่งที่ AI จำได้</h3>
            <button onclick="closeLog()">ปิด</button>
        </div>
        <div id="logList"></div>
    </div>
</div>

<script>
// 1. ค่าเริ่มต้น
const defaultKnowledge = {
    "สวัสดี": "สวัสดี",
    "คุณชื่อ": "DumGenAI",
    "กินข้าว": "ยังเลย นายล่ะ",
    "เป็นไง": "ก็โอเคนะ",
    "บาย": "บาย ไว้คุยกันใหม่"
};

let knowledge = { ...defaultKnowledge };

// โหลดข้อมูลจาก localStorage
let savedKnowledge = localStorage.getItem("ai_knowledge");
if (savedKnowledge) {
    try {
        knowledge = JSON.parse(savedKnowledge);
    } catch(e) {
        console.error("Failed to parse knowledge", e);
    }
}

let learning = false;
let learningWord = "";

function aiReply(text) {
    text = text.toLowerCase();

    for (let key in knowledge) {
        if (text.includes(key)) {
            return knowledge[key];
        }
    }

    learning = true;
    learningWord = text;

    return "ผมยังไม่รู้คำตอบ สอนผมหน่อย";
}

function addMessage(name, msg, cls) {
    let p = document.createElement("p");
    p.className = cls;
    p.innerHTML = "<b>" + name + ":</b> " + msg;

    let chat = document.getElementById("chat");
    chat.appendChild(p);
    chat.scrollTop = chat.scrollHeight;
}

function send() {
    let box = document.getElementById("entry");
    let text = box.value.trim();

    if (text === "") return;

    addMessage("You", text, "user");
    box.value = "";

    if (learning) {
        knowledge[learningWord] = text;
        learning = false;

        // บันทึกลง localStorage
        localStorage.setItem("ai_knowledge", JSON.stringify(knowledge));

        addMessage("AI", "ขอบคุณครับ ผมจำไว้แล้ว", "ai");
        return;
    }

    setTimeout(function() {
        let reply = aiReply(text);
        addMessage("AI", reply, "ai");
    }, 500);
}

// ฟังก์ชันล้างความรู้ทั้งหมด
function resetAI() {
    if (confirm("แน่ใจไหมว่าต้องการลบความรู้ทั้งหมดที่สอนไว้?")) {
        localStorage.removeItem("ai_knowledge");
        knowledge = { ...defaultKnowledge };
        alert("ล้างสมอง AI เรียบร้อยแล้ว!");
        location.reload();
    }
}

// ฟังก์ชันเปิด/ปิด หน้าต่าง Log
function showLog() {
    let logList = document.getElementById("logList");
    logList.innerHTML = "";

    let keys = Object.keys(knowledge);
    if (keys.length === 0) {
        logList.innerHTML = "<p>ยังไม่มีข้อมูลในสมอง</p>";
    } else {
        keys.forEach(key => {
            let item = document.createElement("div");
            item.className = "log-item";
            item.innerHTML = `<b style="color:#66ccff;">${key}</b> : <span style="color:#66ff66;">${knowledge[key]}</span>`;
            logList.appendChild(item);
        });
    }

    document.getElementById("logModal").style.display = "flex";
}

function closeLog() {
    document.getElementById("logModal").style.display = "none";
}

document.getElementById("entry").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        send();
    }
});
</script>

</body>
</html>
