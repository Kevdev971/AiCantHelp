<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Mini AI Chat</title>

<style>
body{
    background:#1b1b1b;
    color:white;
    font-family:Arial;
    margin:20px;
}

#chat{
    width:85%;
    height:400px;
    border:2px solid #555;
    overflow-y:auto;
    padding:10px;
    margin-bottom:10px;
    background:#2d2d2d;
}

.user{
    color:#66ccff;
}

.ai{
    color:#66ff66;
}

input{
    width:75%;
    padding:8px;
}

button{
    padding:8px 15px;
}
</style>

</head>
<body>

<h2>Mini AI Chat</h2>

<div id="chat"></div>

<input id="entry" placeholder="พิมพ์ข้อความ...">
<button onclick="send()">ส่ง</button>

<script>
// 1. กำหนดความรู้พื้นฐาน
let knowledge = {
    "สวัสดี":"สวัสดี มีอะไรให้ช่วย?",
    "ชื่อ":"ฉันเป็น AI จำลอง",
    "กินข้าว":"ยังเลย นายล่ะ",
    "เป็นไง":"ก็โอเคนะ",
    "บาย":"บาย ไว้คุยกันใหม่"
};

// 2. โหลดความรู้เดิมที่เคยสอนไว้จาก localStorage (ถ้ามี)
let savedKnowledge = localStorage.getItem("ai_knowledge");
if (savedKnowledge) {
    // แปลงข้อความที่เซฟไว้กลับมาเป็น Object
    knowledge = JSON.parse(savedKnowledge); 
}

// เก็บสถานะการสอน
let learning = false;
let learningWord = "";

function aiReply(text){
    text = text.toLowerCase();

    for(let key in knowledge){
        if(text.includes(key)){
            return knowledge[key];
        }
    }

    // ถ้าไม่รู้
    learning = true;
    learningWord = text;

    return "ผมยังไม่รู้คำตอบ สอนผมหน่อย";
}

function addMessage(name,msg,cls){
    let p = document.createElement("p");
    p.className = cls;
    p.innerHTML = "<b>" + name + ":</b> " + msg;

    let chat = document.getElementById("chat");
    chat.appendChild(p);
    chat.scrollTop = chat.scrollHeight;
}

function send(){
    let box = document.getElementById("entry");
    let text = box.value.trim();

    if(text == "") return;

    addMessage("You", text, "user");
    box.value = "";

    // ถ้ากำลังรอให้สอน
    if(learning){
        // บันทึกคำตอบใหม่ลงใน knowledge
        knowledge[learningWord] = text;
        learning = false;

        // 3. เซฟความรู้ทั้งหมดลง localStorage เพื่อให้จำได้หลังรีเฟรช
        localStorage.setItem("ai_knowledge", JSON.stringify(knowledge));

        addMessage("AI", "ขอบคุณครับ ผมจำไว้แล้ว", "ai");
        console.log("Current Knowledge:", knowledge);
        return;
    }

    setTimeout(function(){
        let reply = aiReply(text);
        addMessage("AI", reply, "ai");
    }, 500);
}

document.getElementById("entry").addEventListener("keydown", function(e){
    if(e.key == "Enter"){
        send();
    }
});
</script>


</body>
</html>
